name: smos-notify
version: 0.5.0
category: Smos
author: Tom Sydney Kerckhove
maintainer: syd@cs-syd.eu
license: MIT

data-files:
  - assets/ting.wav
  - assets/logo.png

extra-source-files:
- documentation.txt
- options.nix

dependencies:
- base

library:
  source-dirs: src/
  ghc-options: -Wall
  dependencies:
    - conduit
    - containers
    - filepath
    - hashable
    - monad-logger
    - opt-env-conf
    - path
    - path-io
    - persistent
    - persistent-sqlite
    - pretty-relative-time
    - pretty-show
    - process
    - smos-cli
    - smos-data
    - smos-directory
    - text
    - time

executables:
  smos-notify:
    main: Main.hs
    source-dirs: app
    dependencies:
    - smos-notify

tests:
  smos-notify-test:
    main: Spec.hs
    source-dirs: test/
    build-tools: sydtest-discover
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wall
    dependencies:
    - sydtest
    - smos-notify
    - opt-env-conf-test
